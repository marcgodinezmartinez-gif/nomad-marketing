<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Nomad &middot; portada de Un pago, todo el viaje</title>
    <!-- LA PORTADA DEL REEL del v&iacute;deo A de &laquo;Lo que incluye tu viaje&raquo; (29-oct), la de &laquo;Un trazo&raquo; con su frase. Lo mismo que abre el v&iacute;deo: el logo de la app con la
         l&iacute;nea que nace de su cuenco y se despega de &eacute;l, lo que anuncia y una frase que invita. En la cuadr&iacute;cula se ve
         recortada a 3:4 (y 240-1680): todo el contenido va entre 510 y 1404, centrado en esa ventana. Sin la insignia: Apple pide
         una por v&iacute;deo, y &eacute;sa es la del cierre. Se fotograf&iacute;a con portada.sh. -->
    <link rel="stylesheet" href="assets/fuentes.css" />
    <style>
      html, body { margin: 0; padding: 0; background: #FFFDF9; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #100E0B;
              background-color: #FFFDF9;
              background-image: radial-gradient(circle, rgba(16,14,11,.07) 1.6px, rgba(16,14,11,0) 2.1px);
              background-size: 54px 54px; background-position: 3px 11px; }
      p, h1 { margin: 0; position: absolute; left: 84px; width: 912px; text-align: center; white-space: nowrap; }
      /* Sin may&uacute;sculas: &laquo;iPhone&raquo; y &laquo;App Store&raquo; se escriben tal cual (normas de marca de Apple). */
      .kicker { top: 510px; font-family: 'Instrument Sans'; font-size: 42px; line-height: 50px; font-weight: 600; color: #0F766E; }
      #logo { position: absolute; left: 427px; top: 670px; width: 226px; height: 260px; display: block; }
      #trazo { position: absolute; left: 0; top: 0; }
      h1 { font-family: 'Instrument Serif'; font-weight: 400; font-size: 112px; line-height: 1; letter-spacing: -.025em; }
      #h1 { top: 1050px; }
      #h2 { top: 1162px; color: #0F766E; }
      .nombre { top: 1340px; font-family: 'Instrument Serif'; font-size: 64px; line-height: 1; letter-spacing: -.02em; }
    </style>
  </head>
  <body>
    <div id="root">
      <p class="kicker">Ya en la App Store, para iPhone</p>
      <img id="logo" src="assets/marca-grande.png" alt="" />
      <svg id="trazo" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
        <path id="espiral" stroke="#0F766E" stroke-width="7.9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1 id="h1">Un pago,</h1>
      <h1 id="h2">todo el viaje.</h1>
      <p class="nombre">Nomad: gu&iacute;a de viajes</p>
    </div>
    <script>
      // La misma espiral del v&iacute;deo (index.html, escena 0), entera: nace dentro del cuenco de la marca, tangente a
      // su borde (un c&iacute;rculo de centro (540,3, 661,3) y radio 143,6 en el v&iacute;deo), se despega por la derecha y da
      // media vuelta por encima. Aqu&iacute;, a la escala y en el sitio de esta marca.
      (function () {
        var k = 226 / 287, X = function (x) { return 427 + (x - 396.5) * k; }, Y = function (y) { return 670 + (y - 475) * k; };
        var BX = 540.3, BY = 661.3, BR = 143.6, d = [];
        for (var i = 0; i <= 160; i++) {
          var u = i / 160, ph = (72 + (-112 - 72) * u) * Math.PI / 180, r = BR - 8 + 138 * Math.pow(u, 1.3);
          d.push((i ? "L" : "M") + X(BX + r * Math.cos(ph)).toFixed(1) + "," + Y(BY + r * Math.sin(ph)).toFixed(1));
        }
        document.getElementById("espiral").setAttribute("d", d.join(" "));
      })();
    </script>
  </body>
</html>
