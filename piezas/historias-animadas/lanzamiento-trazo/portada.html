<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Nomad &middot; portada de Un trazo</title>
    <!-- LA PORTADA DEL REEL (27-oct). Lo mismo que abre el v&iacute;deo (la pregunta, la cobertura vac&iacute;a y
         la onda que sigue), con la respuesta y el nombre exacto de la app. En la cuadr&iacute;cula se ve
         recortada a 3:4 (y 240-1680): todo el contenido va entre 464 y 1456. Sin la insignia: Apple
         pide una por v&iacute;deo, y &eacute;sa es la del cierre. Se fotograf&iacute;a con portada.sh. -->
    <link rel="stylesheet" href="assets/fuentes.css" />
    <style>
      html, body { margin: 0; padding: 0; background: #FFFDF9; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #100E0B;
              background-color: #FFFDF9;
              background-image: radial-gradient(circle, rgba(16,14,11,.07) 1.6px, rgba(16,14,11,0) 2.1px);
              background-size: 54px 54px; background-position: 3px 11px; }
      p, h1 { margin: 0; position: absolute; left: 84px; width: 912px; text-align: center; white-space: nowrap; }
      /* Sin mayúsculas: «iPhone» y «App Store» se escriben tal cual (normas de marca de Apple). */
      .kicker { top: 460px; font-family: 'Instrument Sans'; font-size: 40px; line-height: 48px; font-weight: 600;
                letter-spacing: .01em; color: #0F766E; }
      h1 { font-family: 'Instrument Serif'; font-weight: 400; font-size: 150px; line-height: 1; letter-spacing: -.025em; }
      #h1 { top: 544px; }
      #h2 { top: 1124px; color: #0F766E; }
      #barras { position: absolute; left: 432px; top: 734px; width: 216px; height: 150px; }
      .barra { position: absolute; bottom: 0; width: 40px; box-sizing: border-box; border: 3px solid rgba(16,14,11,.3); border-radius: 10px; }
      #onda { position: absolute; left: 0; top: 0; }
      .marca { position: absolute; left: 0; width: 1080px; top: 1344px; display: flex; justify-content: center; align-items: center; gap: 26px; }
      .marca img { width: 112px; height: 112px; border-radius: 25px; display: block; box-shadow: 0 12px 30px rgba(16,14,11,.18); }
      .marca span { font-family: 'Instrument Serif'; font-size: 64px; line-height: 1; letter-spacing: -.02em; }
    </style>
  </head>
  <body>
    <div id="root">
      <p class="kicker">Ya en la App Store, para iPhone</p>
      <h1 id="h1">&iquest;Sin cobertura?</h1>
      <div id="barras">
        <div class="barra" style="left: 0; height: 52px;"></div>
        <div class="barra" style="left: 58px; height: 84px;"></div>
        <div class="barra" style="left: 116px; height: 116px;"></div>
        <div class="barra" style="left: 174px; height: 150px;"></div>
      </div>
      <svg id="onda" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
        <path id="trazo" stroke="#0F766E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1 id="h2">Sigue sonando.</h1>
      <div class="marca"><img src="assets/icono-app.png" alt="" /><span>Nomad: gu&iacute;a de viajes</span></div>
    </div>
    <script>
      // La misma onda del v&iacute;deo (index.html, onda()): una campana sim&eacute;trica por dos senos que corren,
      // en el instante 3,3 s, con su latido.
      (function () {
        var X0 = 120, X1 = 960, Y = 1004, t = 3.3, a = 1.3, d = "";
        for (var i = 0; i <= 210; i++) {
          var x = X0 + (X1 - X0) * i / 210, u = (x - X0) / (X1 - X0);
          var env = Math.pow(Math.sin(Math.PI * u), 1.5) * (0.74 + 0.26 * Math.sin(2 * Math.PI * (1.3 * u - 0.45 * t)));
          var s = 0.68 * Math.sin(2 * Math.PI * (x / 92 - 1.7 * t))
                + 0.32 * Math.sin(2 * Math.PI * (x / 57 + 2.3 * t) + 0.9);
          d += (i ? " L" : "M") + x.toFixed(1) + "," + (Y + 62 * a * env * s).toFixed(1);
        }
        document.getElementById("trazo").setAttribute("d", d);
      })();
    </script>
  </body>
</html>
